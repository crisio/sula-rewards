name: Pruebas y publicación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probar-y-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Instalar
        run: |
          npm ci
          npm ci --prefix api

      - name: Revisar tipos (app y API)
        run: |
          npx tsc
          npm --prefix api run typecheck

      - name: Pruebas (PIN, permisos, registro, copiar de ayer, turnos, caja, créditos, importación)
        run: npm test

      - name: Compilar la app
        run: npm run build

      - name: ¿Hay credenciales de Cloudflare?
        id: creds
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Falta el secreto CLOUDFLARE_API_TOKEN: se corrieron las pruebas pero no se publicó. Revisa el README."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # La primera vez, Cloudflare crea la base de datos D1 al publicar. Los cambios de la base son aditivos:
      # se aplican antes de publicar el Worker nuevo (y otra vez después, por si la base se acaba de crear).
      - name: Publicar en Cloudflare y migrar la base
        if: steps.creds.outputs.ok == 'true'
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PIN_DUENO: ${{ secrets.PIN_DUENO }}
        run: |
          node -e '
            const out = process.env.PIN_DUENO ? { PIN_DUENO: process.env.PIN_DUENO } : {}
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/secretos.json", JSON.stringify(out))
          '
          if npx wrangler d1 list --json | grep -Eq '"name": ?"hostales-sps"'; then
            npx wrangler d1 migrations apply DB --remote
          else
            echo "::notice::La base aún no existe; se crea al publicar y se migra después."
          fi
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secretos.json" | tee "$RUNNER_TEMP/deploy.log"
          rm -f "$RUNNER_TEMP/secretos.json"
          npx wrangler d1 migrations apply DB --remote
          url=$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          {
            echo "## Hostales SPS publicado"
            echo ""
            echo "App: ${url:-revisa el registro de wrangler deploy}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::App publicada en ${url}"
