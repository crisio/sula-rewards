name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['api/**', '.github/workflows/deploy-api.yml', '**.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Variable (o secreto) del repositorio: Settings → Secrets and variables → Actions. Sin ella se publica
          # la página de inicio y el panel avisa que falta conectar la API.
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL }}
      # GitHub Pages no conoce las rutas de la app: servimos la app también como 404 para que /tarjeta/ABC funcione.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
