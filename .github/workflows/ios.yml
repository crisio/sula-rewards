name: iOS

# Comprueba que la app de iOS compila (para el simulador y sin firmar). Subir a la App Store se hace desde Xcode en una Mac:
# ver docs/app-store.md.
on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Versión de Xcode
        run: xcodebuild -version
      - name: Compilar para el simulador
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/SulaRewards.xcodeproj \
            -scheme SulaRewards \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Errores y avisos del compilador
        if: always()
        run: grep -E "(error|warning): " "$RUNNER_TEMP/build.log" | grep "/ios/" | sort -u || echo "Sin errores ni avisos."
