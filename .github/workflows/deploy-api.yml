name: Deploy API (Cloudflare)

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/deploy-api.yml']
  pull_request:
    paths: ['api/**']
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Pruebas (login, permisos, sellos, puntos, cashback, gift cards y Wallet)
        run: npm test

      - name: ¿Hay credenciales de Cloudflare?
        id: creds
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Falta el secreto CLOUDFLARE_API_TOKEN: se corrieron las pruebas pero no se publicó. Revisa el README."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # La primera vez, Cloudflare crea la base de datos D1 automáticamente.
      # Los secretos vacíos se omiten (se conservan los que ya estaban publicados).
      - name: Publicar Worker y migrar la base de datos
        if: steps.creds.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          APPLE_PASS_CERT: ${{ secrets.APPLE_PASS_CERT }}
          APPLE_PASS_KEY: ${{ secrets.APPLE_PASS_KEY }}
          APPLE_WWDR_CERT: ${{ secrets.APPLE_WWDR_CERT }}
          GOOGLE_SA_EMAIL: ${{ secrets.GOOGLE_SA_EMAIL }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: |
          if [ ${#AUTH_SECRET} -lt 32 ]; then
            echo "::error::Falta el secreto AUTH_SECRET (mínimo 32 caracteres). Revisa el README."
            exit 1
          fi
          node -e '
            const keys = ["AUTH_SECRET", "RESEND_API_KEY", "GMAIL_USER", "GMAIL_APP_PASSWORD", "APPLE_PASS_CERT", "APPLE_PASS_KEY", "APPLE_WWDR_CERT", "GOOGLE_SA_EMAIL", "GOOGLE_SA_KEY"]
            const out = Object.fromEntries(keys.filter((k) => process.env[k]).map((k) => [k, process.env[k]]))
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/secrets.json", JSON.stringify(out))
          '
          # La base primero (los cambios son aditivos: el Worker anterior sigue funcionando con ellos), así el
          # nuevo nunca corre sin sus columnas. La primera vez la base aún no existe: se crea al publicar.
          dbs=$(npx wrangler d1 list --json)
          if echo "$dbs" | grep -Eq '"name": ?"sula-rewards"'; then
            npx wrangler d1 migrations apply DB --remote
          else
            echo "::notice::La base aún no existe; se migra después de publicar."
          fi
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"
          npx wrangler d1 migrations apply DB --remote
